# Builds the extension zip for each CPU (with its own static Bridge binary)
# and attaches both to the GitHub release for the pushed tag. install.sh
# downloads the one matching the user's machine.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and upload
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -yq gcc libc6-dev git curl make zip
      - name: Build
        run: make pack
      - name: Check binary
        run: |
          file src/bin/proton-bridge
          file src/bin/proton-bridge | grep -q 'statically linked'
          test -f "dist/proton-bridge@aras.local.${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.zip -R "$GITHUB_REPOSITORY" --clobber
